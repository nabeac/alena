<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://a.favicon.im/hey.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}nab_core{% endblock %}</title>

    <style>
        body {
            background: #dae0e6;
        }

        .navbar {
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .card {
            border: 0;
            border-radius: 12px;
        }

        .card:hover {
            transform: translateY(-2px);
            transition: .2s;
        }

        .vote {
            width: 55px;
            background: #f8f9fa;
        }

        .main-content {
            min-height: calc(100vh - 130px);
            padding: 25px 0;
        }

        .auth-box {
            max-width: 420px;
            margin: 50px auto;
        }
    </style>
</head>

<body>

    {% include 'inc/header.html' %}

    <div class="container main-content">

        {% if messages %}
            {% for mass in messages %}
                <div class="alert alert-{{ mass.tags }}">
                    {{ mass }}
                </div>
            {% endfor %}
        {% endif %}

        {% block main %}
        {% endblock %}

    </div>


</body>

</html>
