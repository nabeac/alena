{% extends 'base.html' %}

{% block content %}

<div class="card auth-box shadow-sm">
    <div class="card-body p-4">
        <h3 class="text-center text-danger fw-bold mb-4">Register</h3>

        <form method="post" novalidate>
        {% csrf_token %}

        {{ form }}


            <button class="btn btn-danger w-100">sign in</button>

            <p class="text-center mt-3 mb-0">
                Do have an account?
                <a href="{% url 'account:login' %}">Login</a>
            </p>
        </form>
    </div>
</div>
{% endblock %}
